<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tree Life</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="world" width="800" height="400"></canvas>
      <div id="info-panel">
        <div id="archive-section">
          <div class="dna-title">History</div>
          <div id="archive-status" role="status">Opening history...</div>
          <button id="archive-retry">Retry</button>
          <label>Run <input id="archive-run" type="number" min="1" placeholder="Current" /></label>
          <label>Plant ID <input id="archive-plant" type="number" min="1" value="1" /></label>
          <button id="archive-open">Open record</button>
          <div id="archive-message" role="status"></div>
        </div>
        <div id="info-empty">Click a plant</div>
        <div id="info-content" style="display: none">
          <div class="info-row">
            <span class="label">ID</span><span id="info-id"></span>
          </div>
          <div class="info-row">
            <span class="label">Generation</span
            ><span id="info-generation"></span>
          </div>
          <div class="info-row">
            <span class="label">Born</span><span id="info-born"></span>
          </div>
          <div class="info-row">
            <span class="label">energy</span><span id="info-energy"></span>
          </div>
          <div class="info-row">
            <span class="label">age</span><span id="info-age"></span>
          </div>
          <div class="info-row">
            <span class="label">cells</span><span id="info-cells"></span>
          </div>
          <div class="info-row lineage-row">
            <span class="label">Parents</span>
            <span id="info-parents"></span>
          </div>
          <div class="info-row lineage-row">
            <span class="label">Children</span>
            <span id="info-children"></span>
          </div>
          <div class="dna-title">DNA</div>
          <div id="info-dna"></div>
        </div>
        <div id="genome-section">
          <div class="dna-title">Genomes</div>
          <button id="btn-save-genome" disabled>Save selected</button>
          <div id="genome-list"></div>
        </div>
      </div>
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
